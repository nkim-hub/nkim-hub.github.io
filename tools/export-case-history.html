<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Export case history</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #121a2b; background: #fff; }
      a { color: #1b2f55; font-weight: 600; margin-right: 1.2rem; }
      pre[hidden] { display: none; }
    </style>
  </head>
  <body>
    <h1>Export the synthetic case history</h1>
    <p>
      Builds the case history from <code>case-history-generator.js</code> and offers it as two files. Save them as
      <code>data/case-history.csv</code> (for spreadsheets) and <code>js/case-history.js</code> (loaded by analytics.html).
    </p>
    <p id="summary"></p>
    <p><a id="csvLink" download="case-history.csv">Download CSV</a><a id="jsLink" download="case-history.js">Download JS</a></p>
    <pre id="csvB64" hidden></pre>
    <pre id="jsB64" hidden></pre>

    <script src="../js/data.js"></script>
    <script src="case-history-generator.js"></script>
    <script>
      (() => {
        const AREAS = HB.practiceAreas;
        const STATUSES = HB.statuses;
        const OUTCOMES = ['Settled', 'Completed', 'Trial verdict', 'Dismissed or withdrawn', 'Still open'];
        const SOURCES = ['Client referral', 'Professional referral', 'Online search', 'Returning client'];
        const windowStart = `${HB_HISTORY.months[0]}-01`;
        const DAY = 86400000;

        // Keep every matter that was open at some point in the three-year window. Warm-up matters
        // that closed before it began never appear in any chart.
        const cases = HB_HISTORY.cases.filter((c) => !c.resolved || c.resolved >= windowStart);

        const days = (c) => (c.resolved ? Math.round((Date.parse(c.resolved) - Date.parse(c.opened)) / DAY) : '');
        const csv = [
          'id,practice_area,attorney_id,attorney_name,status,opened,resolved,days_to_resolve,outcome,referral_source,fees_usd,litigated',
          ...cases.map((c) =>
            [c.id, c.area, c.attorney, HB.attorneyName(c.attorney), c.status, c.opened, c.resolved, days(c), c.outcome, c.source, c.fees, c.litigated ? 'yes' : 'no'].join(',')
          ),
        ].join('\n') + '\n';

        const row = (c) =>
          `[${JSON.stringify(c.id)},${AREAS.indexOf(c.area)},${JSON.stringify(c.attorney)},${STATUSES.indexOf(c.status)},${JSON.stringify(c.opened)},${JSON.stringify(c.resolved)},${OUTCOMES.indexOf(c.outcome)},${SOURCES.indexOf(c.source)},${c.fees},${c.litigated ? 1 : 0}]`;
        const js = `// Synthetic case history for Halloway & Brisk LLP, used by analytics.html.
// Generated by tools/export-case-history.html. Do not edit by hand; rebuild it from tools/case-history-generator.js.
// The same ${cases.length} records are in data/case-history.csv. None of it is real client data.
// Covers every matter open at some point from ${HB_HISTORY.months[0]} through ${HB_HISTORY.months[HB_HISTORY.months.length - 1]} (as of ${HB_HISTORY.asOf}).

const HB_HISTORY = (() => {
  const AREAS = ${JSON.stringify(AREAS)};
  const STATUSES = ${JSON.stringify(STATUSES)};
  const OUTCOMES = ${JSON.stringify(OUTCOMES)};
  const SOURCES = ${JSON.stringify(SOURCES)};

  // id, area, attorney, status, opened, resolved ('' while open), outcome, source, fees (USD), litigated
  const rows = [
${cases.map((c) => `    ${row(c)},`).join('\n')}
  ];

  const months = ${JSON.stringify(HB_HISTORY.months)};

  const cases = rows.map((r) => ({
    id: r[0],
    area: AREAS[r[1]],
    attorney: r[2],
    status: STATUSES[r[3]],
    opened: r[4],
    resolved: r[5],
    outcome: OUTCOMES[r[6]],
    source: SOURCES[r[7]],
    fees: r[8],
    litigated: r[9] === 1,
  }));

  return { asOf: ${JSON.stringify(HB_HISTORY.asOf)}, months, cases };
})();
`;

        const b64 = (text) => {
          const bytes = new TextEncoder().encode(text);
          let bin = '';
          bytes.forEach((b) => {
            bin += String.fromCharCode(b);
          });
          return btoa(bin);
        };
        document.getElementById('csvB64').textContent = b64(csv);
        document.getElementById('jsB64').textContent = b64(js);
        document.getElementById('csvLink').href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        document.getElementById('jsLink').href = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
        document.getElementById('summary').textContent = `${cases.length} matters, ${HB_HISTORY.months[0]} to ${HB_HISTORY.months[HB_HISTORY.months.length - 1]}.`;
      })();
    </script>
  </body>
</html>
